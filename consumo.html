<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consumo - Hidrelétrica Residencial</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Histórico de Consumo</h1>

      <h2 id="nomeImovel"></h2>

      <form id="consumoForm">
        <label for="mes">Mês:</label>
        <select id="mes" required>
          <option value="">Selecione</option>
          <option value="1">Janeiro</option>
          <option value="2">Fevereiro</option>
          <option value="3">Março</option>
          <option value="4">Abril</option>
          <option value="5">Maio</option>
          <option value="6">Junho</option>
          <option value="7">Julho</option>
          <option value="8">Agosto</option>
          <option value="9">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>

        <label for="ano">Ano:</label>
        <input type="number" id="ano" min="2000" max="2100" required />

        <label for="consumo">Consumo (kWh):</label>
        <input
          type="number"
          id="consumo"
          min="0"
          step="0.01"
          placeholder="Ex: 350.50"
          required
        />

        <button type="submit">Adicionar consumo</button>
      </form>
      <p id="mensagem"></p>
      <hr />
      <h2>Histórico</h2>
      <div id="historico"></div>
      <br />
      <a href="dashboard.html"> Voltar para o dashboard </a>
    </main>
    <script src="js/consumo.js"></script>
  </body>
</html>
