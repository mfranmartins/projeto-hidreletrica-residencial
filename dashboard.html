<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Hidrelétrica Residencial</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Hidrelétrica Residencial</h1>

      <h2 id="boasVindas"></h2>

      <p>Bem-vindo ao sistema de dimensionamento energético residencial.</p>

      <hr />

      <h3>Imóveis</h3>

      <button onclick="cadastrarImovel()">Cadastrar imóvel</button>

      <div id="listaImoveis"></div>

      <h3>Consumo</h3>

      <p>Aqui será exibido o histórico de consumo dos seus imóveis.</p>

      <h3>Aparelhos</h3>

      <p>Aqui será possível cadastrar os aparelhos da residência.</p>

      <button onclick="logout()">Sair</button>
    </main>
    <script>
      const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

      // Impede acesso sem login
      if (!usuario) {
        window.location.href = "index.html";
      }

      document.getElementById("boasVindas").textContent =
        "Olá, " + usuario.nome + "!";
      const imoveis = JSON.parse(localStorage.getItem("imoveis")) || [];
      const listaImoveis = document.getElementById("listaImoveis");
      const meusImoveis = imoveis.filter(function (imovel) {
        return imovel.usuarioId === usuario.id;
      });

      if (meusImoveis.length === 0) {
        listaImoveis.innerHTML = "<p>Nenhum imóvel cadastrado.</p>";
      } else {
        meusImoveis.forEach(function (imovel) {
          const div = document.createElement("div");
          div.innerHTML = `
            <hr>

            <h4>${imovel.identificacao}</h4>
            <p>
                <strong>Localidade:</strong>
                ${imovel.endereco}
            </p>
            <p>
                <strong>Tipo:</strong>
                ${imovel.tipo}
            </p>
            <button onclick="selecionarImovel(${imovel.id})">
                Selecionar imóvel
            </button>
        `;
          listaImoveis.appendChild(div);
        });
      }

      function cadastrarImovel() {
        window.location.href = "imovel.html";
      }

      function selecionarImovel(id) {
        localStorage.setItem("imovelSelecionado", id);

        alert("Imóvel selecionado!");
      }

      function logout() {
        localStorage.removeItem("usuarioLogado");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
