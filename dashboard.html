<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Hidrelétrica Residencial</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Hidrelétrica Residencial</h1>
      <h2 id="boasVindas"></h2>
      <hr />
      <h2>Meus imóveis</h2>
      <button onclick="cadastrarImovel()">Cadastrar imóvel</button>
      <button onclick="window.location.href = 'comparacao.html'"> Comparar meus imóveis </button>
      <div id="listaImoveis"></div>
      <hr />
      <h2>Gráfico de consumo</h2>
      <p id="nomeGrafico">Selecione um imóvel para visualizar o gráfico.</p>
      <canvas id="graficoConsumo"></canvas>
      <br />
      <button onclick="logout()">Sair</button>
    </main>
    <script src="js/dashboard.js"></script>
  </body>
</html>
